---
# OpenID client authorization scope
# Registers a named authorization scope on the 'test' client's resource server.
apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
kind: ClientAuthorizationScope
metadata:
  name: authz-manage-users-scope
spec:
  forProvider:
    name: manage:users
    realmIdRef:
      name: "dev"
      policy:
        resolve: Always
    resourceServerIdRef:
      name: test
      policy:
        resolve: Always
  providerConfigRef:
    name: "keycloak-provider-config"

---
# OpenID client time policy
# Restricts authorization to business hours (09:00–17:00).
apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
kind: ClientTimePolicy
metadata:
  name: authz-time-policy
spec:
  forProvider:
    name: business-hours-policy
    decisionStrategy: UNANIMOUS
    logic: POSITIVE
    hour: "09"
    hourEnd: "17"
    realmIdRef:
      name: "dev"
      policy:
        resolve: Always
    resourceServerIdRef:
      name: test
      policy:
        resolve: Always
  providerConfigRef:
    name: "keycloak-provider-config"

---
# OpenID client authorization scope policy
# Requires the manage:users scope for access.
apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
kind: ClientAuthorizationClientScopePolicy
metadata:
  name: authz-scope-policy
spec:
  forProvider:
    name: scope-policy
    decisionStrategy: UNANIMOUS
    logic: POSITIVE
    realmIdRef:
      name: "dev"
      policy:
        resolve: Always
    resourceServerIdRef:
      name: test
      policy:
        resolve: Always
    scope:
      - idRef:
          name: authz-manage-users-scope
        required: false
  providerConfigRef:
    name: "keycloak-provider-config"
