# Connection secret key renaming (internal/controller/cluster/connectionsecrettransform).
#
# The provider adds renamed copies of the keys of a managed resource's
# connection secret, so that consumers which expect different key names (e.g.
# Envoy Gateway's OIDC SecurityPolicy, which wants
# "client-id"/"client-secret") can use it directly. The renaming is configured
# in two places:
#
#   1. centrally, on the ProviderConfig
#      (spec.connectionSecretKeys.rename), see
#      dev/apps/keycloak-provider/keycloak-provider-config-secret-transform.yaml
#   2. per resource, with the
#      keycloak.crossplane.io/connection-secret-key-rename annotation, which
#      is merged on top of the ProviderConfig configuration
#
# ...and applies in one of two modes: InPlace (the default: the keys are added
# to the resource's own connection secret, no second secret) or
# SeparateSecret (the connection secret is left untouched and a second,
# transformed secret is published next to it). Both are covered below.
#
# The post-assert hook verifies both clients below.
---
# ProviderConfig-driven renaming in the default InPlace mode: the connection
# secret itself gains client-id/client-secret next to the provider's own
# clientID/clientSecret keys.
apiVersion: openidclient.keycloak.crossplane.io/v1alpha2
kind: Client
metadata:
  name: conn-secret-transform-pc
spec:
  deletionPolicy: Delete
  forProvider:
    realmIdRef:
      name: "dev"
      policy:
        resolve: Always
    accessType: "CONFIDENTIAL"
    clientId: "conn-secret-transform-pc"
    standardFlowEnabled: true
  writeConnectionSecretToRef:
    name: conn-secret-transform-pc
    namespace: dev
  providerConfigRef:
    name: "keycloak-provider-config-secret-transform"
---
# Annotation-driven renaming on top of the default ProviderConfig, which
# configures no renaming at all. It opts into the SeparateSecret mode and
# overrides the name of the published secret, as a consumer would typically
# require a fixed name.
apiVersion: openidclient.keycloak.crossplane.io/v1alpha2
kind: Client
metadata:
  name: conn-secret-transform-annotated
  annotations:
    uptest.upbound.io/post-assert-hook: hooks/assert-connection-secret-transform.sh
    keycloak.crossplane.io/connection-secret-key-rename: "clientID=client-id,clientSecret=client-secret,serviceAccountUserId=service-account-user-id"
    keycloak.crossplane.io/connection-secret-transform-mode: "SeparateSecret"
    keycloak.crossplane.io/connection-secret-transform-name: "conn-secret-transform-envoy"
spec:
  deletionPolicy: Delete
  forProvider:
    realmIdRef:
      name: "dev"
      policy:
        resolve: Always
    accessType: "CONFIDENTIAL"
    clientId: "conn-secret-transform-annotated"
    standardFlowEnabled: true
    serviceAccountsEnabled: true
  writeConnectionSecretToRef:
    name: conn-secret-transform-annotated
    namespace: dev
  providerConfigRef:
    name: "keycloak-provider-config"
