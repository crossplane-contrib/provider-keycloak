# Connection secret key renaming (internal/controller/cluster/connectionsecrettransform).
#
# The provider republishes a managed resource's connection secret with renamed
# keys, so that consumers which expect different key names (e.g. Envoy
# Gateway's OIDC SecurityPolicy, which wants "client-id"/"client-secret") can
# use it directly. The renaming is configured in two places:
#
#   1. centrally, on the ProviderConfig
#      (spec.connectionSecretKeys.rename), see
#      dev/apps/keycloak-provider/keycloak-provider-config-secret-transform.yaml
#   2. per resource, with the
#      keycloak.crossplane.io/connection-secret-key-rename annotation, which
#      is merged on top of the ProviderConfig configuration
#
# The post-assert hook verifies both clients below.
---
# ProviderConfig-driven renaming: clientID -> client-id, clientSecret ->
# client-secret, published as "<secret>-transformed".
apiVersion: openidclient.keycloak.crossplane.io/v1alpha2
kind: Client
metadata:
  name: conn-secret-transform-pc
spec:
  deletionPolicy: Delete
  forProvider:
    realmIdRef:
      name: "dev"
      policy:
        resolve: Always
    accessType: "CONFIDENTIAL"
    clientId: "conn-secret-transform-pc"
    standardFlowEnabled: true
  writeConnectionSecretToRef:
    name: conn-secret-transform-pc
    namespace: dev
  providerConfigRef:
    name: "keycloak-provider-config-secret-transform"
---
# Annotation-driven renaming on top of the default ProviderConfig, which
# configures no renaming at all. The transformed secret name is overridden as
# well, as a consumer would typically require a fixed name.
apiVersion: openidclient.keycloak.crossplane.io/v1alpha2
kind: Client
metadata:
  name: conn-secret-transform-annotated
  annotations:
    uptest.upbound.io/post-assert-hook: hooks/assert-connection-secret-transform.sh
    keycloak.crossplane.io/connection-secret-key-rename: "clientID=client-id,clientSecret=client-secret,serviceAccountUserId=service-account-user-id"
    keycloak.crossplane.io/connection-secret-transform-name: "conn-secret-transform-envoy"
spec:
  deletionPolicy: Delete
  forProvider:
    realmIdRef:
      name: "dev"
      policy:
        resolve: Always
    accessType: "CONFIDENTIAL"
    clientId: "conn-secret-transform-annotated"
    standardFlowEnabled: true
    serviceAccountsEnabled: true
  writeConnectionSecretToRef:
    name: conn-secret-transform-annotated
    namespace: dev
  providerConfigRef:
    name: "keycloak-provider-config"
