# Config of the key provider. Every key of the secret becomes one config
# property of the key provider.
apiVersion: v1
kind: Secret
metadata:
  name: keystore-custom-config
  namespace: dev-ns
stringData:
  priority: "100"
  enabled: "true"
  active: "true"
  eddsaEllipticCurveKey: Ed25519
---
# Keystore of any key provider, here the built-in eddsa-generated provider
# which has no dedicated resource.
apiVersion: realm.keycloak.m.crossplane.io/v1alpha1
kind: KeystoreCustom
metadata:
  name: keystore-custom-eddsa
  namespace: dev-ns
spec:
  forProvider:
    name: eddsa-generated
    providerId: eddsa-generated
    configSecretRef:
      name: keystore-custom-config
    realmIdRef:
      name: "dev-ns"
      policy:
        resolve: Always
  providerConfigRef:
    name: "keycloak-provider-config"
    kind: ProviderConfig
