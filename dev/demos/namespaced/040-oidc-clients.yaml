---
apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha2
kind: Client
metadata:
  name: test
  namespace: dev-ns
spec:
  forProvider:
    realmIdRef:
      name: "dev-ns"
      policy:
        resolve: Always
    accessType: "CONFIDENTIAL"
    clientId: "test"
    fullScopeAllowed: false
    serviceAccountsEnabled: true
    authorization:
      - policyEnforcementMode: "PERMISSIVE"
  providerConfigRef:
    name: "keycloak-provider-config"
    kind: ProviderConfig
---
apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha2
kind: Client
metadata:
  name: account
  namespace: dev-ns
spec:
  # Client Account can not be deleted - Bad Request will be returned!
  managementPolicies: ["Create", "Update", "Observe"]
  forProvider:
    realmIdRef:
      name: "dev-ns"
      policy:
        resolve: Always
    accessType: "CONFIDENTIAL"
    clientId: "account"
  providerConfigRef:
    name: "keycloak-provider-config"
    kind: ProviderConfig
---
apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha2
kind: Client
metadata:
  name: service-acc-1
  namespace: dev-ns
spec:
  forProvider:
    realmIdRef:
      name: "dev-ns"
      policy:
        resolve: Always
    accessType: "CONFIDENTIAL"
    clientId: "service-acc-1"
    serviceAccountsEnabled: true
  providerConfigRef:
    name: "keycloak-provider-config"
    kind: ProviderConfig
---
apiVersion: role.keycloak.m.crossplane.io/v1alpha1
kind: Role
metadata:
  name: svc-role
  namespace: dev-ns
spec:
  forProvider:
    realmId: "dev-ns"
    name: "svc-role"
    clientIdRef:
      name: "test"
      policy:
        resolve: Always
    description: "Role that svc account uses"
  providerConfigRef:
    name: "keycloak-provider-config" # Reference to the provider configuration
    kind: ProviderConfig
---
apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha2
kind: Client
metadata:
  name: realm-management
  namespace: dev-ns
spec:
  # Internal admin client: observe only. Since Keycloak 26.8 reading its
  # secret always returns 403 (#769); observing it must still succeed.
  managementPolicies: ["Observe"]
  forProvider:
    import: true
    realmIdRef:
      name: "dev-ns"
      policy:
        resolve: Always
    clientId: "realm-management"
  providerConfigRef:
    name: "keycloak-provider-config"
    kind: ProviderConfig
