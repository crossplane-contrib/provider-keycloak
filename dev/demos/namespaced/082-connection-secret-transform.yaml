# Connection secret key renaming for a namespaced managed resource
# (internal/controller/cluster/connectionsecrettransform).
#
# Namespaced resources are configured with the
# keycloak.crossplane.io/connection-secret-key-rename annotation only: the
# renaming map lives on the cluster-scoped ProviderConfig, which namespaced
# resources do not necessarily use.
---
apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha2
kind: Client
metadata:
  name: conn-secret-transform-annotated
  namespace: dev-ns
  annotations:
    uptest.upbound.io/post-assert-hook: hooks/assert-connection-secret-transform.sh
    keycloak.crossplane.io/connection-secret-key-rename: "clientID=client-id,clientSecret=client-secret"
spec:
  forProvider:
    realmIdRef:
      name: "dev-ns"
      policy:
        resolve: Always
    accessType: "CONFIDENTIAL"
    clientId: "conn-secret-transform-annotated"
    standardFlowEnabled: true
  writeConnectionSecretToRef:
    name: conn-secret-transform-annotated
  providerConfigRef:
    name: "keycloak-provider-config"
    kind: ProviderConfig
