apiVersion: realm.keycloak.m.crossplane.io/v1alpha1
kind: KeystoreEcdhGenerated
metadata:
  name: ecdh-keystore
  namespace: dev-ns
spec:
  forProvider:
    name: crossplane-ecdh-key
    realmIdRef:
      name: dev-ns
    enabled: true
    active: true
    priority: 100
    ellipticCurveKey: P-256
    algorithm: ECDH-ES
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
