# ProviderConfig used by the connection-secret transform e2e demo
# (dev/demos/basic/082-connection-secret-transform.yaml). It renames the keys
# published in the connection secrets of every resource that uses it, which is
# the ProviderConfig-wide half of the feature. No mode is set, so the default
# InPlace mode applies: the renamed keys are added to the connection secret
# itself. The per-resource half is
# configured with annotations on the managed resource itself and is exercised
# against the default ProviderConfig.
apiVersion: keycloak.crossplane.io/v1beta1
kind: ProviderConfig
metadata:
  name: keycloak-provider-config-secret-transform
spec:
  credentials:
    source: Secret
    secretRef:
      name: keycloak-credentials
      key: credentials
      namespace: crossplane-system
  connectionSecretKeys:
    rename:
      clientID: client-id
      clientSecret: client-secret
