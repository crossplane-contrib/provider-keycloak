---
# Secret used by the master-realm ProviderConfig to test that the provider
# gracefully handles the empty systemInfo.version returned by Keycloak >= 26.4
# when the authenticating service account only has provider-e2e-realm admin roles.
#
# "keycloak_version" is set explicitly here (crossplane-contrib/provider-keycloak#742):
# it is the workaround for Keycloak deployments where the empty-version fallback
# is insufficient, and this also regression-tests that the field is actually
# forwarded to the Terraform provider by internal/clients/keycloak.go.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-nonmaster-credentials
  namespace: crossplane-system
  labels:
    type: provider-credentials
type: Opaque
stringData:
  credentials: |
    {
      "client_id": "provider-e2e-client",
      "client_secret": "provider-e2e-secret",
      "url": "http://$KEYCLOAK_IP:$KEYCLOAK_PORT",
      "base_path": "",
      "realm": "master",
      "keycloak_version": "$KEYCLOAK_VERSION"
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-nonmaster-credentials
  namespace: dev-ns
  labels:
    type: provider-credentials
type: Opaque
stringData:
  credentials: |
    {
      "client_id": "provider-e2e-client",
      "client_secret": "provider-e2e-secret",
      "url": "http://$KEYCLOAK_IP:$KEYCLOAK_PORT",
      "base_path": "",
      "realm": "master",
      "keycloak_version": "$KEYCLOAK_VERSION"
    }
