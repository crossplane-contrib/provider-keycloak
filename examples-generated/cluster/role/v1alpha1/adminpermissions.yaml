apiVersion: role.keycloak.crossplane.io/v1alpha1
kind: AdminPermissions
metadata:
  annotations:
    meta.upbound.io/example-id: role/v1alpha1/adminpermissions
  labels:
    testing.upbound.io/example-name: admins_map_specific_roles
  name: admins-map-specific-roles
spec:
  forProvider:
    decisionStrategy: UNANIMOUS
    description: Admins can map or make composite role-a and role-b
    name: admins-can-map-specific-roles
    policies:
    - ${keycloak_openid_client_group_policy.admins_policy.id}
    realmIdSelector:
      matchLabels:
        testing.upbound.io/example-name: realm
    roleIdsRefs:
    - name: role_a
    - name: role_b
    scopes:
    - map-role
    - map-role-composite

---

apiVersion: group.keycloak.crossplane.io/v1alpha1
kind: Group
metadata:
  annotations:
    meta.upbound.io/example-id: role/v1alpha1/adminpermissions
  labels:
    testing.upbound.io/example-name: admins
  name: admins
spec:
  forProvider:
    name: admins
    realmIdSelector:
      matchLabels:
        testing.upbound.io/example-name: realm

---

apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
kind: ClientGroupPolicy
metadata:
  annotations:
    meta.upbound.io/example-id: role/v1alpha1/adminpermissions
  labels:
    testing.upbound.io/example-name: admins_policy
  name: admins-policy
spec:
  forProvider:
    decisionStrategy: UNANIMOUS
    groups:
    - extendChildren: false
      idSelector:
        matchLabels:
          testing.upbound.io/example-name: admins
      path: ${keycloak_group.admins.path}
    logic: POSITIVE
    name: admins-policy
    realmIdSelector:
      matchLabels:
        testing.upbound.io/example-name: realm
    resourceServerIdSelector:
      matchLabels:
        testing.upbound.io/example-name: keycloak_openid_client

---

apiVersion: realm.keycloak.crossplane.io/v1alpha1
kind: Realm
metadata:
  annotations:
    meta.upbound.io/example-id: role/v1alpha1/adminpermissions
  labels:
    testing.upbound.io/example-name: realm
  name: realm
spec:
  forProvider:
    adminPermissionsEnabled: true
    realm: my-realm

---

apiVersion: role.keycloak.crossplane.io/v1alpha1
kind: Role
metadata:
  annotations:
    meta.upbound.io/example-id: role/v1alpha1/adminpermissions
  labels:
    testing.upbound.io/example-name: role_a
  name: role-a
spec:
  forProvider:
    name: role-a
    realmIdSelector:
      matchLabels:
        testing.upbound.io/example-name: realm

---

apiVersion: role.keycloak.crossplane.io/v1alpha1
kind: Role
metadata:
  annotations:
    meta.upbound.io/example-id: role/v1alpha1/adminpermissions
  labels:
    testing.upbound.io/example-name: role_b
  name: role-b
spec:
  forProvider:
    name: role-b
    realmIdSelector:
      matchLabels:
        testing.upbound.io/example-name: realm
