apiVersion: realm.keycloak.crossplane.io/v1alpha1
kind: KeystoreEcdhGenerated
metadata:
  annotations:
    meta.upbound.io/example-id: realm/v1alpha1/keystoreecdhgenerated
  labels:
    testing.upbound.io/example-name: keystore_ecdh_generated
  name: keystore-ecdh-generated
spec:
  forProvider:
    active: true
    algorithm: ECDH-ES
    ellipticCurveKey: P-256
    enabled: true
    name: my-ecdh-generated-key
    priority: 100
    realmIdSelector:
      matchLabels:
        testing.upbound.io/example-name: realm

---

apiVersion: realm.keycloak.crossplane.io/v1alpha1
kind: Realm
metadata:
  annotations:
    meta.upbound.io/example-id: realm/v1alpha1/keystoreecdhgenerated
  labels:
    testing.upbound.io/example-name: realm
  name: realm
spec:
  forProvider:
    realm: my-realm
