apiVersion: user.keycloak.m.crossplane.io/v1alpha1
kind: AdminPermissions
metadata:
  annotations:
    meta.upbound.io/example-id: user/v1alpha1/adminpermissions
  labels:
    testing.upbound.io/example-name: admins_manage_users
  name: admins-manage-users
  namespace: upbound-system
spec:
  forProvider:
    decisionStrategy: UNANIMOUS
    description: Admins can view and manage all users
    name: admins-can-manage-users
    policies:
    - ${keycloak_openid_client_group_policy.admins_policy.id}
    realmIdSelector:
      matchLabels:
        testing.upbound.io/example-name: realm
    scopes:
    - view
    - manage

---

apiVersion: group.keycloak.m.crossplane.io/v1alpha1
kind: Group
metadata:
  annotations:
    meta.upbound.io/example-id: user/v1alpha1/adminpermissions
  labels:
    testing.upbound.io/example-name: admins
  name: admins
  namespace: upbound-system
spec:
  forProvider:
    name: admins
    realmIdSelector:
      matchLabels:
        testing.upbound.io/example-name: realm

---

apiVersion: group.keycloak.m.crossplane.io/v1alpha1
kind: Group
metadata:
  annotations:
    meta.upbound.io/example-id: user/v1alpha1/adminpermissions
  labels:
    testing.upbound.io/example-name: auditors
  name: auditors
  namespace: upbound-system
spec:
  forProvider:
    name: auditors
    realmIdSelector:
      matchLabels:
        testing.upbound.io/example-name: realm

---

apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
kind: ClientGroupPolicy
metadata:
  annotations:
    meta.upbound.io/example-id: user/v1alpha1/adminpermissions
  labels:
    testing.upbound.io/example-name: admins_policy
  name: admins-policy
  namespace: upbound-system
spec:
  forProvider:
    decisionStrategy: UNANIMOUS
    groups:
    - extendChildren: false
      idSelector:
        matchLabels:
          testing.upbound.io/example-name: admins
      path: ${keycloak_group.admins.path}
    logic: POSITIVE
    name: admins-policy
    realmIdSelector:
      matchLabels:
        testing.upbound.io/example-name: realm
    resourceServerIdSelector:
      matchLabels:
        testing.upbound.io/example-name: keycloak_openid_client

---

apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
kind: ClientGroupPolicy
metadata:
  annotations:
    meta.upbound.io/example-id: user/v1alpha1/adminpermissions
  labels:
    testing.upbound.io/example-name: auditors_policy
  name: auditors-policy
  namespace: upbound-system
spec:
  forProvider:
    decisionStrategy: UNANIMOUS
    groups:
    - extendChildren: false
      idSelector:
        matchLabels:
          testing.upbound.io/example-name: auditors
      path: ${keycloak_group.auditors.path}
    logic: POSITIVE
    name: auditors-policy
    realmIdSelector:
      matchLabels:
        testing.upbound.io/example-name: realm
    resourceServerIdSelector:
      matchLabels:
        testing.upbound.io/example-name: keycloak_openid_client

---

apiVersion: realm.keycloak.m.crossplane.io/v1alpha1
kind: Realm
metadata:
  annotations:
    meta.upbound.io/example-id: user/v1alpha1/adminpermissions
  labels:
    testing.upbound.io/example-name: realm
  name: realm
  namespace: upbound-system
spec:
  forProvider:
    adminPermissionsEnabled: true
    realm: my-realm
