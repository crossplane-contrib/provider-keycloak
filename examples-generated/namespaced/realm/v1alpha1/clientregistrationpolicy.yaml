apiVersion: realm.keycloak.m.crossplane.io/v1alpha1
kind: ClientRegistrationPolicy
metadata:
  annotations:
    meta.upbound.io/example-id: realm/v1alpha1/clientregistrationpolicy
  labels:
    testing.upbound.io/example-name: custom
  name: custom
  namespace: upbound-system
spec:
  forProvider:
    name: My Custom Policy
    providerId: my-client-registration-policy
    realmIdSelector:
      matchLabels:
        testing.upbound.io/example-name: realm
    subType: anonymous

---

apiVersion: realm.keycloak.m.crossplane.io/v1alpha1
kind: Realm
metadata:
  annotations:
    meta.upbound.io/example-id: realm/v1alpha1/clientregistrationpolicy
  labels:
    testing.upbound.io/example-name: realm
  name: realm
  namespace: upbound-system
spec:
  forProvider:
    realm: my-realm
