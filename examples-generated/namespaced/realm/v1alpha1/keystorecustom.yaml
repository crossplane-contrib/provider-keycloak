apiVersion: realm.keycloak.m.crossplane.io/v1alpha1
kind: KeystoreCustom
metadata:
  annotations:
    meta.upbound.io/example-id: realm/v1alpha1/keystorecustom
  labels:
    testing.upbound.io/example-name: hsm
  name: hsm
  namespace: upbound-system
spec:
  forProvider:
    configSecretRef:
      key: example-key
      name: example-secret
    name: hsm-token-signing
    providerId: my-hsm-key-provider
    realmIdSelector:
      matchLabels:
        testing.upbound.io/example-name: realm

---

apiVersion: realm.keycloak.m.crossplane.io/v1alpha2
kind: Realm
metadata:
  annotations:
    meta.upbound.io/example-id: realm/v1alpha1/keystorecustom
  labels:
    testing.upbound.io/example-name: realm
  name: realm
  namespace: upbound-system
spec:
  forProvider:
    realm: my-realm
