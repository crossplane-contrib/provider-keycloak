---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: providerconfigs.keycloak.crossplane.io
spec:
  group: keycloak.crossplane.io
  names:
    categories:
    - crossplane
    - provider
    - keycloak
    kind: ProviderConfig
    listKind: ProviderConfigList
    plural: providerconfigs
    singular: providerconfig
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    - jsonPath: .spec.credentials.secretRef.name
      name: SECRET-NAME
      priority: 1
      type: string
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: A ProviderConfig configures a keycloak provider.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              A ProviderConfigSpec defines the desired state of a ProviderConfig.
              A ProviderConfigSpec defines the desired state of a ProviderConfig.
            properties:
              connectionSecretKeys:
                description: |-
                  ConnectionSecretKeys customizes the connection secret keys published
                  for managed resources that use this ProviderConfig, e.g. renaming
                  "clientID"/"clientSecret" to whatever keys a consumer expects (such as
                  "client-id"/"client-secret" for Envoy Gateway's OIDC SecurityPolicy).
                  This is applied out-of-band from the managed resource reconciliation
                  itself, by a separate controller: by default it adds the configured
                  keys to the resource's own connection secret (the one named by
                  spec.writeConnectionSecretToRef), and it can optionally publish a
                  separate, transformed copy instead. See
                  internal/controller/cluster/connectionsecrettransform for details.
                properties:
                  add:
                    additionalProperties:
                      type: string
                    description: |-
                      Add maps a new connection secret key to a value looked up elsewhere,
                      so that it is added to the connection secret alongside the (renamed)
                      values published by the provider. Each value is a source
                      expression of the form "status:<dot.path>" (a field under the owning
                      managed resource's status, e.g. "status:atProvider.clientId"),
                      "providerConfig:<dot.path>" (a field of this ProviderConfig, e.g.
                      "providerConfig:metadata.name") or "keycloak:<field>" (a value
                      describing the Keycloak deployment the resource lives in, computed
                      from this ProviderConfig's Keycloak URL and the resource's realm:
                      "url", "realm", "issuerUrl", "wellKnownUrl", "authorizationUrl",
                      "tokenUrl", "userinfoUrl", "jwksUrl" or "endSessionUrl" - e.g.
                      "keycloak:issuerUrl" yields
                      "https://keycloak.example.com/realms/my-realm"). Only scalar
                      (string, number, boolean) fields are supported; the source path is
                      never resolved against the credentials Secret itself, so secret
                      material referenced only by name/namespace/key cannot leak this way
                      - "keycloak:" values are derived exclusively from the credentials'
                      non-secret "url" and "base_path" entries.
                    type: object
                  mode:
                    description: |-
                      Mode selects whether the renamed/added keys are written into the
                      managed resource's own connection secret ("InPlace", the default) or
                      into a separate, transformed secret published next to it
                      ("SeparateSecret").
                    enum:
                    - InPlace
                    - SeparateSecret
                    type: string
                  rename:
                    additionalProperties:
                      type: string
                    description: |-
                      Rename maps an existing connection secret key (as published by the
                      provider, e.g. "clientID") to the key name that should be used
                      instead (e.g. "client-id"). Keys that are not listed here are left
                      alone. In the default "InPlace" mode the original key stays as well,
                      i.e. the new name is an additional alias for the same value; in
                      "SeparateSecret" mode only the new name is published.
                    type: object
                type: object
              credentials:
                description: Credentials required to authenticate to this provider.
                properties:
                  env:
                    description: |-
                      Env is a reference to an environment variable that contains credentials
                      that must be used to connect to the provider.
                    properties:
                      name:
                        description: Name is the name of an environment variable.
                        type: string
                    required:
                    - name
                    type: object
                  fs:
                    description: |-
                      Fs is a reference to a filesystem location that contains credentials that
                      must be used to connect to the provider.
                    properties:
                      path:
                        description: Path is a filesystem path.
                        type: string
                    required:
                    - path
                    type: object
                  secretRef:
                    description: |-
                      A SecretRef is a reference to a secret key that contains the credentials
                      that must be used to connect to the provider.
                    properties:
                      key:
                        description: The key to select.
                        type: string
                      name:
                        description: Name of the secret.
                        type: string
                      namespace:
                        description: Namespace of the secret.
                        type: string
                    required:
                    - key
                    - name
                    - namespace
                    type: object
                  source:
                    description: Source of the provider credentials.
                    enum:
                    - None
                    - Secret
                    - Environment
                    - Filesystem
                    type: string
                required:
                - source
                type: object
            required:
            - credentials
            type: object
          status:
            description: A ProviderConfigStatus reflects the observed state of a ProviderConfig.
            properties:
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              users:
                description: Users of this provider configuration.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
