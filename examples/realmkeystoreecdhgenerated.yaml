apiVersion: realm.keycloak.crossplane.io/v1alpha1
kind: KeystoreEcdhGenerated
metadata:
  name: keystore-ecdh-generated
spec:
  forProvider:
    name: my-ecdh-generated-key
    realmIdRef:
      name: my-realm
    enabled: true
    active: true
    priority: 100
    ellipticCurveKey: P-256
    algorithm: ECDH-ES
  providerConfigRef:
    name: keycloak-provider-config
