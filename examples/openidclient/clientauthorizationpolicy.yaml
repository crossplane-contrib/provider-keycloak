apiVersion: v1
kind: Namespace
metadata:
  name: example-clientauthorizationpolicy
---
apiVersion: realm.keycloak.crossplane.io/v1alpha1
kind: Realm
metadata:
  name: example-realm
  namespace: example-clientauthorizationpolicy
spec:
  forProvider:
    realm: example-clientauthorizationpolicy
    enabled: true
  providerConfigRef:
    name: keycloak-provider-config
---
apiVersion: openidclient.keycloak.crossplane.io/v1alpha2
kind: Client
metadata:
  name: example-client
  namespace: example-clientauthorizationpolicy
spec:
  forProvider:
    clientId: example-client
    enabled: true
    accessType: CONFIDENTIAL
    serviceAccountsEnabled: true
    realmIdRef:
      name: example-realm
    authorization:
      - policyEnforcementMode: ENFORCING
  providerConfigRef:
    name: keycloak-provider-config
---
# References a custom policy provider implemented in Java and deployed to
# Keycloak as a JAR. "type" is the id returned by the provider's
# PolicyProviderFactory.getId() -- use this resource for any policy type
# Keycloak doesn't ship a dedicated ClientXPolicy resource for (custom SPI
# providers, or a deployed JavaScript policy referenced as "script-<file>").
apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
kind: ClientAuthorizationPolicy
metadata:
  name: example-custom-policy
  namespace: example-clientauthorizationpolicy
spec:
  forProvider:
    name: example-custom-policy
    type: my-custom-policy-provider
    decisionStrategy: UNANIMOUS
    logic: POSITIVE
    description: Authorization policy backed by a custom Java SPI provider
    realmIdRef:
      name: example-realm
    resourceServerIdRef:
      name: example-client
  providerConfigRef:
    name: keycloak-provider-config
