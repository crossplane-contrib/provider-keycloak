# Adding status/ProviderConfig/Keycloak fields to a Client's connection secret.
#
# Beyond renaming existing keys, the connection secret can gain entirely new
# keys, sourced from the managed resource's status.atProvider, from the
# referenced ProviderConfig object, or from the Keycloak deployment itself
# ("keycloak:<field>": url, realm, issuerUrl, wellKnownUrl, authorizationUrl,
# tokenUrl, userinfoUrl, jwksUrl, endSessionUrl - computed from the
# ProviderConfig's Keycloak URL and the realm the resource lives in, since no
# single object carries them). Values are never sourced from the connection
# secret itself, so this cannot be used to duplicate/leak an existing secret
# value under a different key.
#
# Configured centrally on the ProviderConfig, and/or per resource with the
# keycloak.crossplane.io/connection-secret-add-fields annotation, which is
# merged on top of the ProviderConfig configuration. Both accept a YAML
# mapping or comma-/newline-separated "<newKey>=<source>" pairs.
apiVersion: keycloak.crossplane.io/v1beta1
kind: ProviderConfig
metadata:
  name: keycloak-provider-config-added-fields
spec:
  credentials:
    source: Secret
    secretRef:
      name: keycloak-credentials
      key: credentials
      namespace: crossplane-system
  connectionSecretKeys:
    rename:
      clientID: client-id
      clientSecret: client-secret
    add:
      # The realm's OIDC issuer, e.g. "https://keycloak.example.com/realms/example-added-fields",
      # and its discovery document - everything an OIDC consumer needs next to
      # the client ID and secret.
      issuerUrl: "keycloak:issuerUrl"
      discoveryUrl: "keycloak:wellKnownUrl"
      providerConfigName: "providerConfig:metadata.name"
---
apiVersion: realm.keycloak.crossplane.io/v1alpha1
kind: Realm
metadata:
  name: example-added-fields-realm
spec:
  forProvider:
    realm: example-added-fields
    enabled: true
  providerConfigRef:
    name: keycloak-provider-config-added-fields
---
# The connection secret "crossplane-system/example-added-fields-client" gains
# client-id/client-secret (renamed centrally), issuerUrl/discoveryUrl/
# providerConfigName (added centrally) and internalClientId (added per
# resource, from status).
apiVersion: openidclient.keycloak.crossplane.io/v1alpha2
kind: Client
metadata:
  name: example-added-fields-client
  annotations:
    keycloak.crossplane.io/connection-secret-add-fields: |
      internalClientId: status:atProvider.id
spec:
  forProvider:
    clientId: example-added-fields-client
    enabled: true
    accessType: CONFIDENTIAL
    standardFlowEnabled: true
    realmIdRef:
      name: example-added-fields-realm
  writeConnectionSecretToRef:
    name: example-added-fields-client
    namespace: crossplane-system
  providerConfigRef:
    name: keycloak-provider-config-added-fields
