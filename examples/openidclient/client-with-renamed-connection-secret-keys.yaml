# Renaming the keys of a Client's connection secret.
#
# By default the provider adds the configured keys to the Client's own
# connection secret, i.e. the one named by spec.writeConnectionSecretToRef, so
# consumers that expect different key names (here: Envoy Gateway's OIDC
# SecurityPolicy, which requires "client-id"/"client-secret") can consume that
# very secret directly and no second secret is needed. Renaming in place is
# additive: the original key stays next to the new one, because the Client's
# own controller republishes every key it owns on each reconcile.
#
# Set the mode to SeparateSecret (as the last example below does) to publish a
# second, transformed secret instead and leave the connection secret untouched
# - the only way to get rid of the original key names.
#
# The configuration is read centrally from the ProviderConfig, and/or per
# resource from annotations, which are merged on top of the ProviderConfig
# configuration.
apiVersion: keycloak.crossplane.io/v1beta1
kind: ProviderConfig
metadata:
  name: keycloak-provider-config-renamed-keys
spec:
  credentials:
    source: Secret
    secretRef:
      name: keycloak-credentials
      key: credentials
      namespace: crossplane-system
  connectionSecretKeys:
    rename:
      clientID: client-id
      clientSecret: client-secret
---
apiVersion: realm.keycloak.crossplane.io/v1alpha1
kind: Realm
metadata:
  name: example-renamed-keys-realm
spec:
  forProvider:
    realm: example-renamed-keys
    enabled: true
  providerConfigRef:
    name: keycloak-provider-config-renamed-keys
---
# Renaming from the ProviderConfig only. The connection secret
# "crossplane-system/example-renamed-keys-client" gains the keys client-id and
# client-secret, next to the clientID/clientSecret the provider publishes
# itself.
apiVersion: openidclient.keycloak.crossplane.io/v1alpha2
kind: Client
metadata:
  name: example-renamed-keys-client
spec:
  forProvider:
    clientId: example-renamed-keys-client
    enabled: true
    accessType: CONFIDENTIAL
    standardFlowEnabled: true
    realmIdRef:
      name: example-renamed-keys-realm
  writeConnectionSecretToRef:
    name: example-renamed-keys-client
    namespace: crossplane-system
  providerConfigRef:
    name: keycloak-provider-config-renamed-keys
---
# Renaming for a single resource. The annotations extend the ProviderConfig
# map with serviceAccountUserId and add the Keycloak-internal client ID, so
# that "crossplane-system/example-annotated-keys-client" ends up carrying
# client-id, client-secret, service-account-user-id and internalClientId in
# addition to the provider's own keys.
apiVersion: openidclient.keycloak.crossplane.io/v1alpha2
kind: Client
metadata:
  name: example-annotated-keys-client
  annotations:
    keycloak.crossplane.io/connection-secret-key-rename: "serviceAccountUserId=service-account-user-id"
    keycloak.crossplane.io/connection-secret-add-fields: |
      internalClientId: status:atProvider.id
spec:
  forProvider:
    clientId: example-annotated-keys-client
    enabled: true
    accessType: CONFIDENTIAL
    standardFlowEnabled: true
    serviceAccountsEnabled: true
    realmIdRef:
      name: example-renamed-keys-realm
  writeConnectionSecretToRef:
    name: example-annotated-keys-client
    namespace: crossplane-system
  providerConfigRef:
    name: keycloak-provider-config-renamed-keys
---
# Renaming for a single resource via a dedicated ConnectionSecretTransform
# object instead of annotations. This is namespaced, like the Secret it
# names, so it works the same way for cluster-scoped and namespaced (Client
# vs. openidclient.keycloak.m.crossplane.io Client) managed resources, and it
# is the only annotation-free way to add a rename/add configuration to a
# resource whose manifest you would rather not touch (e.g. one managed by a
# separate GitOps pipeline). It takes precedence over both the ProviderConfig
# and the resource's own annotations, per key.
#
# It also opts into the SeparateSecret mode: the connection secret
# "crossplane-system/example-crd-keys-client" is left untouched and
# republished as "crossplane-system/example-crd-transformed", containing only
# the keys client-id, client-secret and provider-config-name (the latter
# resolved from the name of the ProviderConfig itself).
apiVersion: keycloak.crossplane.io/v1beta1
kind: ConnectionSecretTransform
metadata:
  name: example-crd-transform
  namespace: crossplane-system
spec:
  sourceSecretRef:
    name: example-crd-keys-client
  mode: SeparateSecret
  transformedSecretName: example-crd-transformed
  rename:
    clientID: client-id
    clientSecret: client-secret
  add:
    provider-config-name: "providerConfig:metadata.name"
---
apiVersion: openidclient.keycloak.crossplane.io/v1alpha2
kind: Client
metadata:
  name: example-crd-keys-client
spec:
  forProvider:
    clientId: example-crd-keys-client
    enabled: true
    accessType: CONFIDENTIAL
    standardFlowEnabled: true
    realmIdRef:
      name: example-renamed-keys-realm
  writeConnectionSecretToRef:
    name: example-crd-keys-client
    namespace: crossplane-system
  providerConfigRef:
    name: keycloak-provider-config-renamed-keys
