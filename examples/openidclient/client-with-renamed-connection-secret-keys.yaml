# Renaming the keys of a Client's connection secret.
#
# The provider republishes the connection secret under a second name with the
# keys renamed, so consumers that expect different key names (here: Envoy
# Gateway's OIDC SecurityPolicy, which requires "client-id"/"client-secret")
# can consume it directly. The original secret is left untouched.
#
# The renaming is configured centrally on the ProviderConfig, and/or per
# resource with annotations, which are merged on top of the ProviderConfig
# configuration.
apiVersion: keycloak.crossplane.io/v1beta1
kind: ProviderConfig
metadata:
  name: keycloak-provider-config-renamed-keys
spec:
  credentials:
    source: Secret
    secretRef:
      name: keycloak-credentials
      key: credentials
      namespace: crossplane-system
  connectionSecretKeys:
    rename:
      clientID: client-id
      clientSecret: client-secret
---
apiVersion: realm.keycloak.crossplane.io/v1alpha1
kind: Realm
metadata:
  name: example-renamed-keys-realm
spec:
  forProvider:
    realm: example-renamed-keys
    enabled: true
  providerConfigRef:
    name: keycloak-provider-config-renamed-keys
---
# Renaming from the ProviderConfig only. The connection secret
# "crossplane-system/example-renamed-keys-client" is republished as
# "crossplane-system/example-renamed-keys-client-transformed" with the keys
# client-id and client-secret.
apiVersion: openidclient.keycloak.crossplane.io/v1alpha2
kind: Client
metadata:
  name: example-renamed-keys-client
spec:
  forProvider:
    clientId: example-renamed-keys-client
    enabled: true
    accessType: CONFIDENTIAL
    standardFlowEnabled: true
    realmIdRef:
      name: example-renamed-keys-realm
  writeConnectionSecretToRef:
    name: example-renamed-keys-client
    namespace: crossplane-system
  providerConfigRef:
    name: keycloak-provider-config-renamed-keys
---
# Renaming for a single resource. The annotations extend the ProviderConfig
# map with serviceAccountUserId and choose the name of the republished secret,
# which is written as "crossplane-system/example-envoy-oidc".
apiVersion: openidclient.keycloak.crossplane.io/v1alpha2
kind: Client
metadata:
  name: example-annotated-keys-client
  annotations:
    keycloak.crossplane.io/connection-secret-key-rename: "serviceAccountUserId=service-account-user-id"
    keycloak.crossplane.io/connection-secret-transform-name: "example-envoy-oidc"
spec:
  forProvider:
    clientId: example-annotated-keys-client
    enabled: true
    accessType: CONFIDENTIAL
    standardFlowEnabled: true
    serviceAccountsEnabled: true
    realmIdRef:
      name: example-renamed-keys-realm
  writeConnectionSecretToRef:
    name: example-annotated-keys-client
    namespace: crossplane-system
  providerConfigRef:
    name: keycloak-provider-config-renamed-keys
