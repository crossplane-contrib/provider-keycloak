# The same result with a Crossplane v2 Composition instead of the provider's
# connection secret transform.
#
# This example exists for comparison: it produces the secret an Envoy Gateway
# OIDC SecurityPolicy needs (client-id/client-secret plus the realm's issuer
# URL) without using the provider's connection secret transform
# (ProviderConfig.spec.connectionSecretKeys, the annotations or the
# ConnectionSecretTransform object) at all. See
# docs/content/docs/using/reference/provider-config.md for a comparison of the
# two approaches.
#
# The Composition composes the Keycloak Client and, next to it, a plain
# Kubernetes Secret whose keys it fills from the Client's connection details -
# the pattern Crossplane v2 recommends since it no longer aggregates
# connection details for composite resources itself. A namespaced composite
# resource can compose core Kubernetes objects such as a Secret directly, so
# no provider-kubernetes is needed.
#
# Trade-offs compared to the provider's own transform:
#
#   * The Client is no longer written by the user, it is composed - the
#     transform works on resources that already exist, a Composition owns
#     them.
#   * A second secret is unavoidable here: the Client's own connection secret
#     is written by the provider and a Composition cannot add keys to it. The
#     transform's default InPlace mode writes into the connection secret
#     itself.
#   * The issuer URL has to be spelled out by whoever writes the composite
#     resource, because a Composition cannot read the Keycloak URL from the
#     ProviderConfig's credentials Secret. The transform derives it with
#     "keycloak:issuerUrl".
#   * On the other hand this needs no provider feature at all, and the
#     resulting Secret can be shaped freely, including keys the transform
#     cannot produce.
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-go-templating
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-go-templating:v0.11.2
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-auto-ready
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-auto-ready:v0.5.0
---
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: oidcclients.example.org
spec:
  group: example.org
  names:
    kind: OIDCClient
    plural: oidcclients
  # Namespaced composite resources are the Crossplane v2 default. The composed
  # Keycloak Client and the Secret are created in the composite's namespace.
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                realm:
                  description: Name of the Realm resource the client is created in.
                  type: string
                clientId:
                  description: Keycloak client ID of the composed Client.
                  type: string
                issuerUrl:
                  description: |
                    OIDC issuer of the realm, e.g.
                    https://keycloak.example.com/realms/example-composition. A
                    Composition cannot derive this itself, unlike the
                    provider's "keycloak:issuerUrl" add-field source.
                  type: string
                writeConnectionSecretToRef:
                  type: object
                  properties:
                    name:
                      type: string
                  required:
                    - name
              required:
                - realm
                - clientId
                - issuerUrl
                - writeConnectionSecretToRef
---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: oidcclients.example.org
spec:
  compositeTypeRef:
    apiVersion: example.org/v1alpha1
    kind: OIDCClient
  mode: Pipeline
  pipeline:
    - step: render
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $spec := $.observed.composite.resource.spec }}
            {{- $resources := default dict $.observed.resources }}
            {{- $connectionDetails := dig "connectionDetails" dict (dig "client" dict $resources) }}
            ---
            apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha2
            kind: Client
            metadata:
              annotations:
                {{ setResourceNameAnnotation "client" }}
            spec:
              forProvider:
                clientId: {{ $spec.clientId | quote }}
                enabled: true
                accessType: CONFIDENTIAL
                standardFlowEnabled: true
                realmIdRef:
                  name: {{ $spec.realm | quote }}
              writeConnectionSecretToRef:
                name: {{ printf "%s-client" $.observed.composite.resource.metadata.name | quote }}
              providerConfigRef:
                name: keycloak-provider-config
                kind: ClusterProviderConfig
            ---
            # The transformed secret. Renaming means picking a connection
            # detail up under a different key, adding means encoding a value
            # from the composite resource. Connection details are already
            # base64-encoded, so they are used as they are.
            apiVersion: v1
            kind: Secret
            metadata:
              name: {{ $spec.writeConnectionSecretToRef.name | quote }}
              annotations:
                {{ setResourceNameAnnotation "connection-secret" }}
            data:
              client-id: {{ dig "clientID" "" $connectionDetails | quote }}
              client-secret: {{ dig "clientSecret" "" $connectionDetails | quote }}
              issuer-url: {{ $spec.issuerUrl | b64enc | quote }}
    - step: ready
      functionRef:
        name: function-auto-ready
---
apiVersion: realm.keycloak.m.crossplane.io/v1alpha1
kind: Realm
metadata:
  name: example-composition
  namespace: default
spec:
  forProvider:
    realm: example-composition
    enabled: true
  providerConfigRef:
    name: keycloak-provider-config
    kind: ClusterProviderConfig
---
# Creates the Keycloak client "example-app" in that realm, its provider-written
# connection secret "default/example-app-client" (clientID/clientSecret) and
# the composed secret "default/example-app-oidc" holding client-id,
# client-secret and issuer-url.
apiVersion: example.org/v1alpha1
kind: OIDCClient
metadata:
  name: example-app
  namespace: default
spec:
  realm: example-composition
  clientId: example-app
  issuerUrl: https://keycloak.example.com/realms/example-composition
  writeConnectionSecretToRef:
    name: example-app-oidc
