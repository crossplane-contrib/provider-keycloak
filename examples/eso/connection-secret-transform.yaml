# The same result with External Secrets Operator (ESO) instead of the provider's
# connection secret transform.
#
# This example exists for comparison: it produces the secret an Envoy Gateway
# OIDC SecurityPolicy needs (client-id/client-secret plus the realm's issuer
# URL) without using the provider's connection secret transform
# (ProviderConfig.spec.connectionSecretKeys, the annotations or the
# ConnectionSecretTransform object) at all. See
# docs/content/docs/using/reference/provider-config.md for a comparison of the
# two approaches.
#
# How it works:
#   1. A ClusterSecretStore (or SecretStore) is configured to read Kubernetes
#      Secrets from the same namespace. Here we use the Kubernetes provider
#      that ships with ESO, pointing at the in-cluster API server.
#   2. An ExternalSecret selects individual keys from the Crossplane connection
#      secret (crossplane-system/example-eso-client) and remaps them:
#        clientID      → client-id
#        clientSecret  → client-secret
#      It also adds a literal value for the issuer URL (which is not stored in
#      the connection secret; you must spell it out here, unlike the provider's
#      "keycloak:issuerUrl" add-field source that derives it automatically).
#   3. ESO writes the result into a fresh Kubernetes Secret in the same
#      namespace. The issuer URL is supplied as a literal in the ExternalSecret.
#
# Prerequisites:
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm install external-secrets external-secrets/external-secrets \
#     --namespace external-secrets-system --create-namespace
#
# Trade-offs compared to the provider's own transform:
#   * ESO must be installed separately.
#   * The issuer URL must be spelled out in the ExternalSecret; the provider's
#     transform derives it automatically from "keycloak:issuerUrl".
#   * ESO produces a standard v1 Secret (type Opaque), not a Crossplane
#     connection secret. That is intentional: ESO shaping is the right place
#     to bridge from Crossplane's internal format to application secrets.
#   * ESO can aggregate across multiple source secrets in one ExternalSecret,
#     add templated values, pull from external vaults, etc. — things the
#     provider's transform cannot do.
#   * The provider's InPlace transform requires no extra tooling and works
#     uniformly whether or not ESO is installed.

# ---------------------------------------------------------------------------
# 1. ClusterSecretStore — Kubernetes provider, reads Secrets from the cluster
#    (for namespace-scoped reading use a SecretStore instead)
# ---------------------------------------------------------------------------
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: keycloak-connection-secrets
spec:
  provider:
    kubernetes:
      # The ESO Kubernetes provider reads Secrets from the in-cluster API
      # server using the service account it runs under, or an explicit token.
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: kube-system
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets-system
      # Restrict the store to one namespace so that it can only read from
      # crossplane-system (where Crossplane writes connection secrets).
      remoteNamespace: crossplane-system
---
# ---------------------------------------------------------------------------
# 2. Keycloak Client whose connection secret we will reshape
#    (skip this if the Client already exists)
# ---------------------------------------------------------------------------
apiVersion: openidclient.keycloak.crossplane.io/v1alpha2
kind: Client
metadata:
  name: example-eso-client
spec:
  forProvider:
    clientId: example-eso-client
    enabled: true
    accessType: CONFIDENTIAL
    standardFlowEnabled: true
    realmIdRef:
      name: example-realm
  writeConnectionSecretToRef:
    name: example-eso-client
    namespace: crossplane-system
  providerConfigRef:
    name: keycloak-provider-config
---
# ---------------------------------------------------------------------------
# 3. ExternalSecret — reads clientID/clientSecret from the connection secret,
#    remaps keys, adds the literal issuer URL, and writes the result into
#    crossplane-system/example-eso-oidc.
# ---------------------------------------------------------------------------
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: example-eso-oidc
  namespace: crossplane-system
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: keycloak-connection-secrets
    kind: ClusterSecretStore
  target:
    name: example-eso-oidc
    creationPolicy: Owner
    template:
      # Produce a plain Opaque secret; applications (e.g. Envoy Gateway's
      # OIDC SecurityPolicy) read it as a normal Kubernetes Secret.
      type: Opaque
      data:
        # Rename clientID → client-id
        client-id: "{{ .clientID }}"
        # Rename clientSecret → client-secret
        client-secret: "{{ .clientSecret }}"
        # The issuer URL is not stored in the connection secret, so it must
        # be supplied here. The provider's "keycloak:issuerUrl" source
        # derives it automatically, but ESO has no access to ProviderConfig
        # credentials, so you must write it out.
        issuer-url: "https://keycloak.example.com/realms/example-realm"
  data:
    # Pull individual keys from the Crossplane connection secret.
    - secretKey: clientID
      remoteRef:
        key: example-eso-client  # name of the connection secret
        property: clientID
    - secretKey: clientSecret
      remoteRef:
        key: example-eso-client
        property: clientSecret
