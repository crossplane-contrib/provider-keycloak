---
# Fine-grained admin permissions (FGAPv2) for groups.
#
# Requires Keycloak 26.2+ started with the `admin-fine-grained-authz:v2`
# feature and a realm with `adminPermissionsEnabled: true`. Keycloak then
# creates an `admin-permissions` client that acts as the resource server for
# all admin permissions of that realm.
#
# Each AdminPermissions resource is exactly one permission. It either applies
# to all groups of the realm, or only to the groups listed in `groupIdsRefs`.
apiVersion: realm.keycloak.crossplane.io/v1alpha1
kind: Realm
metadata:
  name: example-groupadminpermissions-realm
spec:
  forProvider:
    realm: example-groupadminpermissions
    enabled: true
    adminPermissionsEnabled: true
  providerConfigRef:
    name: keycloak-provider-config

---
apiVersion: group.keycloak.crossplane.io/v1alpha1
kind: Group
metadata:
  name: example-groupadminpermissions-group
spec:
  forProvider:
    name: example-managed-group
    realmIdRef:
      name: example-groupadminpermissions-realm
  providerConfigRef:
    name: keycloak-provider-config

---
# Example 1: A permission covering every group of the realm.
apiVersion: group.keycloak.crossplane.io/v1alpha1
kind: AdminPermissions
metadata:
  name: example-admins-view-groups
spec:
  forProvider:
    name: admins-can-view-groups
    description: Admins can view every group of the realm
    decisionStrategy: UNANIMOUS
    realmIdRef:
      name: example-groupadminpermissions-realm
    scopes:
      - view
      - view-members
  providerConfigRef:
    name: keycloak-provider-config

---
# Example 2: A permission restricted to a single group and evaluated against
# the policies attached to it.
#
# Policies have to live on the realm's `admin-permissions` client. Their IDs
# can either be set directly via `policies`, or resolved from managed policy
# resources via the typed reference fields (`groupPolicies`, `rolePolicies`,
# `userPolicies`, ...).
apiVersion: group.keycloak.crossplane.io/v1alpha1
kind: AdminPermissions
metadata:
  name: example-support-manage-managed-group
spec:
  forProvider:
    name: support-can-manage-managed-group
    description: Support can manage the members of the managed group
    decisionStrategy: UNANIMOUS
    realmIdRef:
      name: example-groupadminpermissions-realm
    groupIdsRefs:
      - name: example-groupadminpermissions-group
    scopes:
      - manage-members
      - manage-membership
    policies:
      - 4b0b7b4c-4a3f-4d2e-9f24-8b7b1a5d2c11
  providerConfigRef:
    name: keycloak-provider-config
