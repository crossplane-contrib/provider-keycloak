apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: realm-flow-bindings-ownership
spec:
  # Regression test for crossplane-contrib/provider-keycloak#751: a Realm
  # that does not declare its flow bindings must not take ownership of them,
  # otherwise every Realm update resets the binding applied by a Bindings
  # resource for the same realm (e.g. browserFlow back to "browser") and the
  # two resources oscillate forever.
  #
  # The test asserts that
  #   1. the Realm never late-initializes the flow bindings into
  #      spec.forProvider, and
  #   2. a Realm update triggered by an unrelated field keeps the browser
  #      flow that the Bindings resource applied.
  #
  # Requires a cluster with the provider deployed and the
  # "keycloak-provider-config" ProviderConfig already applied, i.e. the same
  # prerequisites as the `uptest` target.
  timeouts:
    apply: 1m
    assert: 5m
    cleanup: 5m
    delete: 5m
  steps:
    - name: create-realm-flow-and-bindings
      try:
        - apply:
            resource:
              apiVersion: realm.keycloak.crossplane.io/v1alpha1
              kind: Realm
              metadata:
                name: realmflowbindings751
              spec:
                deletionPolicy: Delete
                forProvider:
                  realm: realmflowbindings751
                  displayName: before-update
                providerConfigRef:
                  name: keycloak-provider-config
        - apply:
            resource:
              apiVersion: authenticationflow.keycloak.crossplane.io/v1alpha1
              kind: Flow
              metadata:
                name: realmflowbindings751-browser
              spec:
                deletionPolicy: Delete
                forProvider:
                  alias: realmflowbindings751-browser
                  realmIdRef:
                    name: realmflowbindings751
                providerConfigRef:
                  name: keycloak-provider-config
        - apply:
            resource:
              apiVersion: authenticationflow.keycloak.crossplane.io/v1alpha1
              kind: Bindings
              metadata:
                name: realmflowbindings751
              spec:
                deletionPolicy: Delete
                forProvider:
                  browserFlowRef:
                    name: realmflowbindings751-browser
                  realmIdRef:
                    name: realmflowbindings751
                providerConfigRef:
                  name: keycloak-provider-config
        - assert:
            resource:
              apiVersion: authenticationflow.keycloak.crossplane.io/v1alpha1
              kind: Bindings
              metadata:
                name: realmflowbindings751
              status:
                (conditions[?type == 'Ready'] | [0].status): "True"
                (conditions[?type == 'Synced'] | [0].status): "True"
                atProvider:
                  browserFlow: realmflowbindings751-browser
        - assert:
            resource:
              apiVersion: realm.keycloak.crossplane.io/v1alpha1
              kind: Realm
              metadata:
                name: realmflowbindings751
              spec:
                forProvider:
                  (browserFlow == null): true
                  (registrationFlow == null): true
                  (directGrantFlow == null): true
                  (resetCredentialsFlow == null): true
                  (clientAuthenticationFlow == null): true
                  (dockerAuthenticationFlow == null): true
              status:
                (conditions[?type == 'Ready'] | [0].status): "True"
                (conditions[?type == 'Synced'] | [0].status): "True"

    - name: update-realm-keeps-browser-flow-from-bindings
      try:
        # Changing an unrelated field forces a reconcile and a full realm
        # update. Before #751 was fixed, the late-initialized
        # browserFlow: browser was sent along with it and reset the binding.
        - patch:
            resource:
              apiVersion: realm.keycloak.crossplane.io/v1alpha1
              kind: Realm
              metadata:
                name: realmflowbindings751
              spec:
                forProvider:
                  displayName: after-update
        - assert:
            resource:
              apiVersion: realm.keycloak.crossplane.io/v1alpha1
              kind: Realm
              metadata:
                name: realmflowbindings751
              spec:
                forProvider:
                  (browserFlow == null): true
              status:
                (conditions[?type == 'Synced'] | [0].status): "True"
                atProvider:
                  displayName: after-update
                  browserFlow: realmflowbindings751-browser
