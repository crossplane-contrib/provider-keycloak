# Chainsaw e2e test for the connectionsecrettransform controller
# (internal/controller/cluster/connectionsecrettransform).
#
# Unlike the uptest-based demos (dev/demos/basic/082-connection-secret-transform.yaml),
# which exercise the controller as a side-effect of applying Crossplane managed
# resources, this suite is directly controller-focused:
#
#   1. It sets up a Realm + Client in Keycloak via the provider.
#   2. It drives the controller's three configuration surfaces:
#      a. ProviderConfig-wide rename + add (keycloak: sources)
#      b. Annotation-driven rename, add and name override (SeparateSecret mode)
#      c. ConnectionSecretTransform CRD (namespace-scoped, highest precedence)
#   3. It validates the resulting Secret by actually deploying an Envoy Gateway
#      OIDC SecurityPolicy and a Traefik OIDC plugin Middleware that reference
#      the transformed secret — real application consumers confirm the secret
#      is not just syntactically correct but structurally usable.
#
# The infrastructure (Envoy Gateway + Traefik) is installed by
# cluster/test/controller/setup.sh before chainsaw runs.
#
# Naming convention:
#   - Resources that should be cleaned up by chainsaw are created with `create`
#     steps; the cleanup section deletes them in reverse order.
#   - The Realm `ctrl-e2e` is shared across all scenarios to reduce test time.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: connectionsecrettransform
  namespace: dev
spec:
  # Run each scenario sequentially so we can share the Realm without races.
  concurrent: false
  timeouts:
    apply: 30s
    assert: 5m
    cleanup: 2m
  steps:
    # -----------------------------------------------------------------------
    # Step 0: Shared Realm
    # Create the Realm that all scenarios share. The assert waits until the
    # Realm is Ready before proceeding so subsequent Client applies don't race
    # against realm creation.
    # -----------------------------------------------------------------------
    - name: create-shared-realm
      try:
        - apply:
            resource:
              apiVersion: realm.keycloak.crossplane.io/v1alpha1
              kind: Realm
              metadata:
                name: ctrl-e2e
              spec:
                forProvider:
                  realm: ctrl-e2e
                  enabled: true
                providerConfigRef:
                  name: keycloak-provider-config
        - assert:
            resource:
              apiVersion: realm.keycloak.crossplane.io/v1alpha1
              kind: Realm
              metadata:
                name: ctrl-e2e
              (contains(status.conditions[?type == 'Ready'].status || `[]`, 'True')): true
              (contains(status.conditions[?type == 'Synced'].status || `[]`, 'True')): true

    # -----------------------------------------------------------------------
    # Step 1: ProviderConfig-wide rename + keycloak-derived adds (InPlace mode)
    #
    # Uses the ProviderConfig "keycloak-provider-config-secret-transform", which
    # renames clientID→client-id, clientSecret→client-secret and adds
    # keycloak:issuerUrl, keycloak:wellKnownUrl, keycloak:realm.
    # The controller writes these directly into the connection secret (InPlace,
    # the default mode), so no second secret is produced.
    # -----------------------------------------------------------------------
    - name: inplace-providerconfig
      try:
        - apply:
            resource:
              apiVersion: openidclient.keycloak.crossplane.io/v1alpha2
              kind: Client
              metadata:
                name: ctrl-e2e-inplace
              spec:
                forProvider:
                  realmIdRef:
                    name: ctrl-e2e
                    policy:
                      resolve: Always
                  clientId: ctrl-e2e-inplace
                  accessType: CONFIDENTIAL
                  standardFlowEnabled: true
                  validRedirectUris:
                    - "*"
                writeConnectionSecretToRef:
                  name: ctrl-e2e-inplace
                  namespace: dev
                providerConfigRef:
                  name: keycloak-provider-config-secret-transform

        - assert:
            # The Client must reach Ready before the connection secret exists.
            resource:
              apiVersion: openidclient.keycloak.crossplane.io/v1alpha2
              kind: Client
              metadata:
                name: ctrl-e2e-inplace
              (contains(status.conditions[?type == 'Ready'].status || `[]`, 'True')): true

        # The controller adds renamed and Keycloak-derived keys to the
        # connection secret. Assert that the critical keys are present.
        - assert:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: ctrl-e2e-inplace
                namespace: dev
              # The controller records which keys it manages so that it can
              # clean them up cleanly when config changes.
              (contains(metadata.annotations."keycloak.crossplane.io/connection-secret-transform-keys" || '', 'client-id')): true
              (contains(metadata.annotations."keycloak.crossplane.io/connection-secret-transform-keys" || '', 'client-secret')): true
              (contains(metadata.annotations."keycloak.crossplane.io/connection-secret-transform-keys" || '', 'issuerUrl')): true
              data:
                # Original keys from the provider are retained (merge-patch
                # semantics: the controller never deletes provider-owned keys).
                (clientID != null): true
                (clientSecret != null): true
                # Renamed aliases written by the controller.
                (client-id != null): true
                (client-secret != null): true
                # Both aliases must carry the same base64 value.
                (client-id == clientID): true
                (client-secret == clientSecret): true
                # Keycloak-derived fields.
                (issuerUrl != null): true
                (discoveryUrl != null): true
                (realmName != null): true

        # No second secret should have been created in InPlace mode.
        - error:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: ctrl-e2e-inplace-transformed
                namespace: dev

    # -----------------------------------------------------------------------
    # Step 2: Envoy Gateway OIDC SecurityPolicy referencing the InPlace secret
    #
    # Validates that the secret produced in step 1 is structurally valid for
    # use as an Envoy Gateway OIDC SecurityPolicy clientSecret source.
    # The SecurityPolicy is not actually enforced here (no traffic), but
    # Envoy Gateway's admission webhook rejects an invalid secret reference,
    # so the apply step itself is the assertion.
    # -----------------------------------------------------------------------
    - name: envoy-gateway-security-policy
      try:
        - apply:
            resource:
              apiVersion: gateway.envoyproxy.io/v1alpha1
              kind: SecurityPolicy
              metadata:
                name: ctrl-e2e-oidc-sp
                namespace: dev
              spec:
                targetRef:
                  group: gateway.networking.k8s.io
                  kind: Gateway
                  name: ctrl-e2e-gw  # referenced but need not exist for admission validation
                oidc:
                  provider:
                    # A placeholder issuer — EG's admission webhook only validates
                    # schema (minLength: 1); live HTTPS enforcement is at runtime.
                    issuer: "https://placeholder.example.com/realms/ctrl-e2e"
                  # clientID is a plain string in Envoy Gateway v1.4 (not a secret ref).
                  clientID: "ctrl-e2e-inplace"
                  # clientSecret is a SecretObjectReference: only name (+ optional
                  # namespace) are valid fields — EG hard-codes the key "client-secret".
                  # The transform controller writes clientSecret under that exact key,
                  # which is what this step implicitly validates.
                  clientSecret:
                    name: ctrl-e2e-inplace
                    namespace: dev

    # -----------------------------------------------------------------------
    # Step 3: Annotation-driven SeparateSecret mode
    #
    # The annotations override the default ProviderConfig to request a
    # SeparateSecret output. The transformed secret is published under a
    # stable name (ctrl-e2e-envoy-oidc), which a real consumer (Envoy, Traefik)
    # would reference.
    # -----------------------------------------------------------------------
    - name: annotation-separate-secret
      try:
        - apply:
            resource:
              apiVersion: openidclient.keycloak.crossplane.io/v1alpha2
              kind: Client
              metadata:
                name: ctrl-e2e-annotated
                namespace: dev
                annotations:
                  keycloak.crossplane.io/connection-secret-key-rename: "clientID=client-id,clientSecret=client-secret,serviceAccountUserId=service-account-user-id"
                  keycloak.crossplane.io/connection-secret-add-fields: |
                    issuerUrl: keycloak:issuerUrl
                    realmName: keycloak:realm
                  keycloak.crossplane.io/connection-secret-transform-mode: SeparateSecret
                  keycloak.crossplane.io/connection-secret-transform-name: ctrl-e2e-envoy-oidc
              spec:
                forProvider:
                  realmIdRef:
                    name: ctrl-e2e
                    policy:
                      resolve: Always
                  clientId: ctrl-e2e-annotated
                  accessType: CONFIDENTIAL
                  standardFlowEnabled: true
                  serviceAccountsEnabled: true
                  validRedirectUris:
                    - "*"
                writeConnectionSecretToRef:
                  name: ctrl-e2e-annotated
                  namespace: dev
                providerConfigRef:
                  name: keycloak-provider-config

        - assert:
            resource:
              apiVersion: openidclient.keycloak.crossplane.io/v1alpha2
              kind: Client
              metadata:
                name: ctrl-e2e-annotated
              (contains(status.conditions[?type == 'Ready'].status || `[]`, 'True')): true

        # Source secret is untouched (the controller does not modify it in
        # SeparateSecret mode).
        - assert:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: ctrl-e2e-annotated
                namespace: dev
              data:
                # Provider-owned keys are present.
                (clientID != null): true
                (clientSecret != null): true
                # The controller must NOT have written renamed keys here.
                (to_string(keys(@)) | contains(@, 'client-id')): false

        # Transformed secret published under the annotation-specified name.
        - assert:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: ctrl-e2e-envoy-oidc
                namespace: dev
                labels:
                  keycloak.crossplane.io/connection-secret-transform: "true"
                  keycloak.crossplane.io/connection-secret-source: ctrl-e2e-annotated
              data:
                (client-id != null): true
                (client-secret != null): true
                (service-account-user-id != null): true
                (issuerUrl != null): true
                (realmName != null): true
                # Original keys are not present in SeparateSecret mode.
                (to_string(keys(@)) | contains(@, 'clientID')): false

    # -----------------------------------------------------------------------
    # Step 4: Traefik OIDC plugin middleware referencing the SeparateSecret
    #
    # Deploys a Traefik Middleware of type plugin/traefik-oidc-auth (the
    # sevensolutions/traefik-oidc-auth Traefik plugin) that reads client
    # credentials directly from the ctrl-e2e-envoy-oidc Secret produced in
    # step 3.  Traefik validates the Middleware CRD on admission; the plugin is
    # pre-installed by cluster/test/controller/setup.sh so the apply does
    # not require a live plugin catalog lookup.
    # -----------------------------------------------------------------------
    - name: traefik-oidc-plugin-middleware
      try:
        - apply:
            resource:
              apiVersion: traefik.io/v1alpha1
              kind: Middleware
              metadata:
                name: ctrl-e2e-oidc-plugin
                namespace: dev
              spec:
                plugin:
                  traefik-oidc-auth:
                    # Provider credentials are sourced from the Kubernetes Secret
                    # written by the connectionsecrettransform controller, using
                    # the key names it emits: client-id, client-secret, issuerUrl.
                    Provider:
                      Url:
                        valueFrom:
                          secretKeyRef:
                            name: ctrl-e2e-envoy-oidc
                            key: issuerUrl
                      ClientId:
                        valueFrom:
                          secretKeyRef:
                            name: ctrl-e2e-envoy-oidc
                            key: client-id
                      ClientSecret:
                        valueFrom:
                          secretKeyRef:
                            name: ctrl-e2e-envoy-oidc
                            key: client-secret
                    Scopes:
                      - openid
                      - profile
                      - email

    # -----------------------------------------------------------------------
    # Step 5: ConnectionSecretTransform CRD (highest precedence)
    #
    # A ConnectionSecretTransform object names the source secret directly and
    # is applied without touching the managed resource. It merges on top of
    # the ProviderConfig and annotation maps.
    # -----------------------------------------------------------------------
    - name: connectionsecrettransform-crd
      try:
        - apply:
            resource:
              apiVersion: keycloak.crossplane.io/v1beta1
              kind: ConnectionSecretTransform
              metadata:
                name: ctrl-e2e-crd-override
                namespace: dev
              spec:
                sourceSecretRef:
                  name: ctrl-e2e-inplace
                transformedSecretName: ctrl-e2e-crd-output
                rename:
                  # Override: publish clientSecret under a different name than
                  # the ProviderConfig would choose.
                  clientSecret: oidc-client-secret
                add:
                  # Add an additional field not present in the ProviderConfig.
                  realm: keycloak:realm

        - assert:
            resource:
              apiVersion: keycloak.crossplane.io/v1beta1
              kind: ConnectionSecretTransform
              metadata:
                name: ctrl-e2e-crd-override
                namespace: dev
              (contains(status.conditions[?type == 'Ready'].status || `[]`, 'True')): true

        - assert:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: ctrl-e2e-crd-output
                namespace: dev
              data:
                (oidc-client-secret != null): true
                (realm != null): true

    # -----------------------------------------------------------------------
    # Step 6: Stale secret garbage collection
    #
    # Verify that when the ConnectionSecretTransform object is deleted the
    # output secret it created is also deleted (owner reference GC).
    # -----------------------------------------------------------------------
    - name: gc-on-crd-delete
      try:
        - delete:
            ref:
              apiVersion: keycloak.crossplane.io/v1beta1
              kind: ConnectionSecretTransform
              name: ctrl-e2e-crd-override
              namespace: dev

        # The output secret should be gone within a short time via owner-ref GC.
        - error:
            timeout: 60s
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: ctrl-e2e-crd-output
                namespace: dev

  # -------------------------------------------------------------------------
  # Cleanup
  # -------------------------------------------------------------------------
  # Chainsaw deletes resources created with `apply` in reverse order. The
  # Realm deletion is intentionally last: deleting the realm cascades to the
  # Keycloak-side clients, so the Client finalizers complete faster.
