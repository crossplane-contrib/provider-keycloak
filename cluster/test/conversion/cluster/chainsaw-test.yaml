apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: crd-version-conversion-cluster
spec:
  # Verifies the CRD conversion webhook for the cluster-scoped
  # openidclient.keycloak.crossplane.io/Client, whose clientSecretWoVersion
  # field changed from `number` (v1alpha1) to `string` (v1alpha2) when the
  # embedded terraform-provider-keycloak schema was corrected.
  #
  # Both the upgrade path (write v1alpha1, read v1alpha2) and the downgrade
  # path (write v1alpha2, read v1alpha1) are exercised, because the conversion
  # webhook is what keeps manifests of the released v2.x provider working on
  # v3.0.0.
  timeouts:
    apply: 5m
    assert: 10m
    delete: 10m
  steps:
    - name: assert-the-crd-serves-both-versions-through-a-webhook
      try:
        - assert:
            resource:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: clients.openidclient.keycloak.crossplane.io
              spec:
                conversion:
                  strategy: Webhook
                  webhook:
                    clientConfig:
                      # The caBundle and the service coordinates are injected
                      # by the Crossplane package manager. Without them the API
                      # server cannot reach the provider and every read of a
                      # non-storage version fails.
                      (length(caBundle) > `0`): true
                      service:
                        path: /convert
                versions:
                  - name: v1alpha1
                    served: true
                    storage: false
                  - name: v1alpha2
                    served: true
                    storage: true
        - assert:
            resource:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: identityproviders.oidc.keycloak.crossplane.io
              spec:
                conversion:
                  strategy: Webhook
                  webhook:
                    clientConfig:
                      (length(caBundle) > `0`): true
                      service:
                        path: /convert
                versions:
                  - name: v1alpha1
                    served: true
                    storage: false
                  - name: v1alpha2
                    served: true
                    storage: true
        # Also wait for the Realm CRD to be established so that the
        # create-the-prerequisites step can apply a Realm immediately.
        - assert:
            resource:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: realms.realm.keycloak.crossplane.io
              status:
                (conditions[?type=='Established'].status | [0]): 'True'

    - name: create-the-prerequisites
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: conversion-test
                namespace: ($namespace)
              stringData:
                client-id: conversion-test-client-id
                client-secret: conversion-test-secret
        - apply:
            resource:
              apiVersion: realm.keycloak.crossplane.io/v1alpha1
              kind: Realm
              metadata:
                name: conversion-test
              spec:
                deletionPolicy: Delete
                forProvider:
                  realm: conversion-test
                providerConfigRef:
                  name: keycloak-provider-config
        - assert:
            resource:
              apiVersion: realm.keycloak.crossplane.io/v1alpha1
              kind: Realm
              metadata:
                name: conversion-test
              status:
                (length(conditions[?type == 'Ready' && status == 'True']) == `1`): true
                (length(conditions[?type == 'Synced' && status == 'True']) == `1`): true

    - name: create-the-client-with-the-previous-api-version
      try:
        # Exactly what a user of provider-keycloak v2.x would have applied:
        # apiVersion v1alpha1 with a *numeric* clientSecretWoVersion.
        - apply:
            resource:
              apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
              kind: Client
              metadata:
                name: conversion-test
              spec:
                deletionPolicy: Delete
                forProvider:
                  realmIdRef:
                    name: conversion-test
                  clientId: conversion-test
                  accessType: CONFIDENTIAL
                  clientSecretWoSecretRef:
                    name: conversion-test
                    namespace: ($namespace)
                    key: client-secret
                  clientSecretWoVersion: 1
                providerConfigRef:
                  name: keycloak-provider-config
    - name: upgrade-read-the-object-through-the-new-api-version
      try:
        # Reading the object as v1alpha2 goes through the conversion webhook,
        # which has to turn the stored number into a string.
        - assert:
            resource:
              apiVersion: openidclient.keycloak.crossplane.io/v1alpha2
              kind: Client
              metadata:
                name: conversion-test
              spec:
                forProvider:
                  clientId: conversion-test
                  clientSecretWoVersion: "1"
                  (type(clientSecretWoVersion) == 'string'): true

    - name: downgrade-read-the-object-through-the-previous-api-version
      try:
        # ... and back again, so that clients pinned to v1alpha1 keep seeing a
        # number.
        - assert:
            resource:
              apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
              kind: Client
              metadata:
                name: conversion-test
              spec:
                forProvider:
                  clientId: conversion-test
                  clientSecretWoVersion: 1
                  (type(clientSecretWoVersion) == 'number'): true

    - name: update-through-the-new-api-version
      try:
        - apply:
            resource:
              apiVersion: openidclient.keycloak.crossplane.io/v1alpha2
              kind: Client
              metadata:
                name: conversion-test
              spec:
                deletionPolicy: Delete
                forProvider:
                  realmIdRef:
                    name: conversion-test
                  clientId: conversion-test
                  accessType: CONFIDENTIAL
                  clientSecretWoSecretRef:
                    name: conversion-test
                    namespace: ($namespace)
                    key: client-secret
                  clientSecretWoVersion: "2"
                providerConfigRef:
                  name: keycloak-provider-config
        - assert:
            resource:
              apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
              kind: Client
              metadata:
                name: conversion-test
              spec:
                forProvider:
                  clientSecretWoVersion: 2
                  (type(clientSecretWoVersion) == 'number'): true
        - assert:
            resource:
              apiVersion: openidclient.keycloak.crossplane.io/v1alpha2
              kind: Client
              metadata:
                name: conversion-test
              status:
                (length(conditions[?type == 'Ready' && status == 'True']) == `1`): true
                (length(conditions[?type == 'Synced' && status == 'True']) == `1`): true

    - name: create-the-identity-provider-with-the-previous-api-version
      try:
        # The very same in-place type change also hit oidc/IdentityProvider,
        # so the second converted kind is exercised end-to-end as well.
        - apply:
            resource:
              apiVersion: oidc.keycloak.crossplane.io/v1alpha1
              kind: IdentityProvider
              metadata:
                name: conversion-test
              spec:
                deletionPolicy: Delete
                forProvider:
                  alias: conversion-test
                  authorizationUrl: https://authorizationurl.com
                  tokenUrl: https://tokenurl.com
                  clientIdSecretRef:
                    name: conversion-test
                    namespace: ($namespace)
                    key: client-id
                  clientSecretWoSecretRef:
                    name: conversion-test
                    namespace: ($namespace)
                    key: client-secret
                  clientSecretWoVersion: 1
                  realmRef:
                    name: conversion-test
                providerConfigRef:
                  name: keycloak-provider-config
        - assert:
            resource:
              apiVersion: oidc.keycloak.crossplane.io/v1alpha1
              kind: IdentityProvider
              metadata:
                name: conversion-test
              status:
                (length(conditions[?type == 'Ready' && status == 'True']) == `1`): true
                (length(conditions[?type == 'Synced' && status == 'True']) == `1`): true

    - name: upgrade-read-the-identity-provider-through-the-new-api-version
      try:
        - assert:
            resource:
              apiVersion: oidc.keycloak.crossplane.io/v1alpha2
              kind: IdentityProvider
              metadata:
                name: conversion-test
              spec:
                forProvider:
                  alias: conversion-test
                  clientSecretWoVersion: "1"
                  (type(clientSecretWoVersion) == 'string'): true

    - name: cleanup
      try:
        - delete:
            ref:
              apiVersion: oidc.keycloak.crossplane.io/v1alpha1
              kind: IdentityProvider
              name: conversion-test
        - delete:
            ref:
              apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
              kind: Client
              name: conversion-test
        - delete:
            ref:
              apiVersion: realm.keycloak.crossplane.io/v1alpha1
              kind: Realm
              name: conversion-test
