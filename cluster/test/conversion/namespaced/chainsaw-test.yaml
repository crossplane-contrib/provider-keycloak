apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: crd-version-conversion-namespaced
spec:
  # Same as ../cluster/chainsaw-test.yaml, but for the namespaced (Crossplane
  # v2 style) openidclient.keycloak.m.crossplane.io/Client.
  timeouts:
    apply: 5m
    assert: 10m
    delete: 10m
  steps:
    - name: assert-the-crd-serves-both-versions-through-a-webhook
      try:
        - assert:
            resource:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: clients.openidclient.keycloak.m.crossplane.io
              spec:
                conversion:
                  strategy: Webhook
                  webhook:
                    clientConfig:
                      (length(caBundle) > `0`): true
                      service:
                        path: /convert
                versions:
                  - name: v1alpha1
                    served: true
                    storage: false
                  - name: v1alpha2
                    served: true
                    storage: true

    - name: create-the-prerequisites
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: conversion-test
                namespace: ($namespace)
              stringData:
                client-secret: conversion-test-secret
        - apply:
            resource:
              apiVersion: realm.keycloak.m.crossplane.io/v1alpha1
              kind: Realm
              metadata:
                name: conversion-test-ns
                namespace: ($namespace)
              spec:
                forProvider:
                  realm: conversion-test-ns
                providerConfigRef:
                  name: keycloak-provider-config
                  kind: ProviderConfig
        - assert:
            resource:
              apiVersion: realm.keycloak.m.crossplane.io/v1alpha1
              kind: Realm
              metadata:
                name: conversion-test-ns
                namespace: ($namespace)
              status:
                conditions:
                  - type: Ready
                    status: "True"
                  - type: Synced
                    status: "True"

    - name: create-the-client-with-the-previous-api-version
      try:
        - apply:
            resource:
              apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
              kind: Client
              metadata:
                name: conversion-test-ns
                namespace: ($namespace)
              spec:
                forProvider:
                  realmIdRef:
                    name: conversion-test-ns
                  clientId: conversion-test-ns
                  accessType: CONFIDENTIAL
                  clientSecretWoSecretRef:
                    name: conversion-test
                    key: client-secret
                  clientSecretWoVersion: 1
                providerConfigRef:
                  name: keycloak-provider-config
                  kind: ProviderConfig
        - assert:
            resource:
              apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
              kind: Client
              metadata:
                name: conversion-test-ns
                namespace: ($namespace)
              status:
                conditions:
                  - type: Ready
                    status: "True"
                  - type: Synced
                    status: "True"

    - name: upgrade-read-the-object-through-the-new-api-version
      try:
        - assert:
            resource:
              apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha2
              kind: Client
              metadata:
                name: conversion-test-ns
                namespace: ($namespace)
              spec:
                forProvider:
                  clientId: conversion-test-ns
                  clientSecretWoVersion: "1"
                  (type(clientSecretWoVersion) == 'string'): true

    - name: downgrade-read-the-object-through-the-previous-api-version
      try:
        - assert:
            resource:
              apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
              kind: Client
              metadata:
                name: conversion-test-ns
                namespace: ($namespace)
              spec:
                forProvider:
                  clientId: conversion-test-ns
                  clientSecretWoVersion: 1
                  (type(clientSecretWoVersion) == 'number'): true

    - name: cleanup
      try:
        - delete:
            ref:
              apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
              kind: Client
              name: conversion-test-ns
              namespace: ($namespace)
        - delete:
            ref:
              apiVersion: realm.keycloak.m.crossplane.io/v1alpha1
              kind: Realm
              name: conversion-test-ns
              namespace: ($namespace)
